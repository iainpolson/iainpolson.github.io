<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson App</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// --- simple inline icons (no external icon package needed) ---
function IconHeart({ size = 20, filled = false, color = "#E0574B" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? color : "none"} stroke={color} strokeWidth="2">
      <path d="M12 21s-6.7-4.3-9.3-8.1C.8 9.8 1.6 6 4.9 4.9 7 4.2 9.2 5 12 7.5c2.8-2.5 5-3.3 7.1-2.6 3.3 1.1 4.1 4.9 2.2 8-2.6 3.8-9.3 8.1-9.3 8.1z"/>
    </svg>
  );
}
function IconCheck({ size = 20, color = "white" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="20 6 9 17 4 12" />
    </svg>
  );
}
function IconX({ size = 20, color = "white" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  );
}
function IconRestart({ size = 18, color = "white" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="1 4 1 10 7 10" />
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
    </svg>
  );
}

const QUESTIONS = [
  { prompt: "casa", options: ["house", "cat", "road", "bread"], answer: "house" },
  { prompt: "el perro", options: ["the cat", "the dog", "the bird", "the fish"], answer: "the dog" },
  { prompt: "comer", options: ["to sleep", "to run", "to eat", "to sing"], answer: "to eat" },
  { prompt: "agua", options: ["fire", "water", "earth", "air"], answer: "water" },
  { prompt: "buenos días", options: ["good night", "good afternoon", "good morning", "goodbye"], answer: "good morning" },
  { prompt: "el libro", options: ["the pen", "the book", "the table", "the door"], answer: "the book" },
];

const MAX_LIVES = 3;

function LessonApp() {
  const [index, setIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [status, setStatus] = useState("idle");
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(MAX_LIVES);
  const [done, setDone] = useState(false);
  const [failed, setFailed] = useState(false);

  const q = QUESTIONS[index];
  const progress = Math.round((index / QUESTIONS.length) * 100);

  const ink = "#16302E";
  const teal = "#1B4B4A";
  const cream = "#FBF6EC";
  const mustard = "#E8A33D";
  const coral = "#E0574B";
  const green = "#4C9A6A";

  function choose(opt) {
    if (status !== "idle") return;
    setSelected(opt);
    if (opt === q.answer) {
      setStatus("correct");
      setScore((s) => s + 1);
    } else {
      setStatus("wrong");
      setLives((l) => {
        const next = l - 1;
        if (next <= 0) setFailed(true);
        return next;
      });
    }
  }

  function next() {
    if (failed) return;
    if (index + 1 >= QUESTIONS.length) {
      setDone(true);
      return;
    }
    setIndex((i) => i + 1);
    setSelected(null);
    setStatus("idle");
  }

  function restart() {
    setIndex(0);
    setSelected(null);
    setStatus("idle");
    setScore(0);
    setLives(MAX_LIVES);
    setDone(false);
    setFailed(false);
  }

  if (done || failed) {
    return (
      <div style={{ background: teal, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <div style={{ background: cream, borderRadius: 24, maxWidth: 380, width: "100%", padding: 32, textAlign: "center", boxShadow: "0 10px 30px rgba(0,0,0,0.25)" }}>
          <div style={{ width: 72, height: 72, borderRadius: "50%", background: failed ? coral : mustard, margin: "0 auto 20px", display: "flex", alignItems: "center", justifyContent: "center" }}>
            {failed ? <IconX size={36} /> : <IconCheck size={36} />}
          </div>
          <h1 style={{ color: ink, fontWeight: 800, fontSize: 24, marginBottom: 4 }}>
            {failed ? "Out of hearts" : "Lesson complete"}
          </h1>
          <p style={{ color: teal, opacity: 0.8, marginBottom: 24 }}>
            {failed
              ? `You got ${score} of ${QUESTIONS.length} before running out.`
              : `You scored ${score} out of ${QUESTIONS.length}.`}
          </p>
          <button
            onClick={restart}
            style={{ background: teal, color: cream, width: "100%", padding: "12px 0", borderRadius: 16, border: "none", fontWeight: 700, fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
          >
            <IconRestart /> Try again
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: teal, minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 380 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 8, marginBottom: 32 }}>
          <div style={{ background: "rgba(255,255,255,0.15)", borderRadius: 999, height: 10, flex: 1, overflow: "hidden" }}>
            <div style={{ width: `${progress}%`, background: mustard, height: "100%", borderRadius: 999, transition: "width 300ms ease" }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            {Array.from({ length: MAX_LIVES }).map((_, i) => (
              <IconHeart key={i} size={20} filled={i < lives} color={i < lives ? coral : "rgba(255,255,255,0.3)"} />
            ))}
          </div>
        </div>

        <div style={{ background: cream, borderRadius: 24, padding: 24, boxShadow: "0 10px 30px rgba(0,0,0,0.2)" }}>
          <p style={{ color: teal, letterSpacing: 1, fontSize: 12, fontWeight: 700, textTransform: "uppercase", opacity: 0.7, marginBottom: 8 }}>
            Translate this word
          </p>
          <h1 style={{ color: ink, fontSize: 30, fontWeight: 800, marginBottom: 24, marginTop: 0 }}>
            {q.prompt}
          </h1>

          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {q.options.map((opt) => {
              const isSelected = selected === opt;
              const isAnswer = opt === q.answer;
              let bg = "white";
              let border = "#E5DFD2";
              let textColor = ink;

              if (status !== "idle") {
                if (isAnswer) {
                  bg = "#E6F2EA"; border = green; textColor = green;
                } else if (isSelected) {
                  bg = "#FBEAE8"; border = coral; textColor = coral;
                }
              }

              return (
                <button
                  key={opt}
                  onClick={() => choose(opt)}
                  disabled={status !== "idle"}
                  style={{
                    background: bg,
                    border: `2px solid ${border}`,
                    color: textColor,
                    borderRadius: 14,
                    textAlign: "left",
                    padding: "12px 16px",
                    fontWeight: 600,
                    fontSize: 16,
                  }}
                >
                  {opt}
                </button>
              );
            })}
          </div>
        </div>

        {status !== "idle" && (
          <div style={{ background: status === "correct" ? green : coral, borderRadius: 18, marginTop: 16, padding: 16, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, color: "white", fontWeight: 700 }}>
              {status === "correct" ? <IconCheck /> : <IconX />}
              {status === "correct" ? "Nice!" : `Correct answer: ${q.answer}`}
            </div>
            <button
              onClick={next}
              style={{ background: "white", color: status === "correct" ? green : coral, padding: "8px 16px", borderRadius: 12, border: "none", fontWeight: 700 }}
            >
              Continue
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LessonApp />);
</script>
</body>
</html>
